<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Step 1 - Magnifying glass (diagnosis) -->
  <circle cx="16" cy="16" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <line x1="21" y1="21" x2="24" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Arrow right -->
  <path d="M28 16H32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34 14L36 16L34 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Step 2 - Document (planning) -->
  <rect x="38" y="10" width="8" height="12" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <line x1="40" y1="13" x2="44" y2="13" stroke="currentColor" stroke-width="1"/>
  <line x1="40" y1="16" x2="44" y2="16" stroke="currentColor" stroke-width="1"/>
  
  <!-- Arrow down -->
  <path d="M16 30V34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M14 36L16 38L18 36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Step 3 - Gear (execution) -->
  <circle cx="16" cy="48" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <line x1="16" y1="42" x2="16" y2="40" stroke="currentColor" stroke-width="1"/>
  <line x1="16" y1="56" x2="16" y2="54" stroke="currentColor" stroke-width="1"/>
  <line x1="22" y1="48" x2="24" y2="48" stroke="currentColor" stroke-width="1"/>
  <line x1="10" y1="48" x2="8" y2="48" stroke="currentColor" stroke-width="1"/>
  
  <!-- Arrow right -->
  <path d="M26 48H30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 46L34 48L32 50" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Step 4 - Graph (results) -->
  <polyline points="42,54 44,52 46,53 48,50" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="56" x2="50" y2="56" stroke="currentColor" stroke-width="1"/>
  <line x1="40" y1="44" x2="40" y2="56" stroke="currentColor" stroke-width="1"/>
</svg>