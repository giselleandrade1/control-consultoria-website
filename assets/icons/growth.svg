<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chart/Graph background -->
  <rect x="8" y="12" width="48" height="40" rx="3" stroke="currentColor" stroke-width="2" fill="none"/>
  
  <!-- Grid -->
  <line x1="8" y1="24" x2="56" y2="24" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8" y1="36" x2="56" y2="36" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  <line x1="8" y1="48" x2="56" y2="48" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Ascending line chart -->
  <polyline points="16,40 24,32 32,36 40,20 48,16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Area fill under line -->
  <path d="M16,40 L24,32 L32,36 L40,20 L48,16 L48,50 L16,50 Z" fill="currentColor" opacity="0.1"/>
  
  <!-- Axis lines -->
  <line x1="12" y1="50" x2="56" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <line x1="12" y1="12" x2="12" y2="50" stroke="currentColor" stroke-width="1.5"/>
</svg>